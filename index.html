<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FreshDIY — Family HelloFresh Planner & Dairy-Free Kitchen Engine</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreshDIY" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <!-- Pre-occupy Netlify HUD / badge IDs so /.netlify/scripts/hud exits immediately without mounting an iframe over the mobile bottom nav -->
    <div id="nl-badge-frame" hidden aria-hidden="true" style="display:none!important"></div>
    <div id="nl-hud-frame" hidden aria-hidden="true" style="display:none!important"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
        });
      }
      // Prevent & remove any injected third-party floating HUD/badge that overlaps the mobile bottom bar
      (function () {
        try {
          localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
          localStorage.setItem('nl-hud:public:v1', 'hidden:' + (Date.now() + 5 * 24 * 60 * 60 * 1000));
        } catch (e) {}

        function removeFloatingBadges() {
          document.querySelectorAll(
            'iframe#nl-badge-frame, iframe#nl-hud-frame, script[data-nf-variant], script[src*=".netlify/scripts"], body > a[href*="netlify"]'
          ).forEach((el) => el.remove());
        }
        removeFloatingBadges();
        const obs = new MutationObserver(removeFloatingBadges);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>

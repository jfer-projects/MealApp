<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FreshDIY — Family HelloFresh Planner & Dairy-Free Kitchen Engine</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreshDIY" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
        });
      }
      // Remove any injected third-party floating badge that overlaps the mobile bottom bar
      (function () {
        function removeFloatingBadges() {
          document.querySelectorAll('body > a[href*="netlify"], body > div:not(#root)').forEach((el) => {
            const text = (el.textContent || '').toLowerCase();
            const html = (el.innerHTML || '').toLowerCase();
            if (text.includes('netlify') || html.includes('netlify.com')) {
              el.remove();
            }
          });
        }
        removeFloatingBadges();
        const obs = new MutationObserver(removeFloatingBadges);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
